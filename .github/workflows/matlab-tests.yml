name: MATLAB Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

env:
  MATLAB_RELEASE: R2025a

jobs:
  shell-wrapper:
    name: Shell Wrapper Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Bash wrapper syntax
        run: bash -n scripts/run_matlab_tests.sh

      - name: Check Bash wrapper help
        run: bash scripts/run_matlab_tests.sh --help

      - name: Check Bash wrapper build task smoke
        run: MATLAB_CMD=true bash scripts/run_matlab_tests.sh testProject

      - name: Check removed selector flags are rejected
        run: |
          if bash scripts/run_matlab_tests.sh --suite; then
            echo "Expected --suite to be rejected"
            exit 1
          fi

  quality:
    name: Quality Guardrails
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs

      - name: Run quality guardrails
        uses: matlab-actions/run-build@v3
        with:
          tasks: checkStyle
          startup-options: -logfile artifacts/logs/matlab.log

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-quality
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/logs/**

  unit:
    name: Unit And Coverage
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs

      - name: Run unit tests and coverage
        uses: matlab-actions/run-build@v3
        with:
          tasks: testUnit coverage
          startup-options: -logfile artifacts/logs/matlab.log

      - name: Upload unit and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-unit-coverage
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/coverage/**
            artifacts/logs/**

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs

      - name: Run integration tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: testIntegration
          startup-options: -logfile artifacts/logs/matlab.log

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-integration
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/logs/**

  gui-structural:
    name: GUI Structural Tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs

      - name: Run GUI structural tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: testGuiStructural
          startup-options: -logfile artifacts/logs/matlab.log

      - name: Upload GUI structural artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-gui-structural
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/gui/**
            artifacts/logs/**

  gui-gesture:
    name: GUI Gesture Tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs

      - name: Run GUI gesture tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: testGuiGesture
          startup-options: -logfile artifacts/logs/matlab.log

      - name: Upload GUI gesture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-gui-gesture
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/gui/**
            artifacts/logs/**
