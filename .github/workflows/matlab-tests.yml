name: MATLAB Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

env:
  MATLAB_RELEASE: R2025a

concurrency:
  group: matlab-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check MATLAB Project metadata is local
        run: |
          tracked="$(git ls-files -- LabKit.prj resources/project)"
          if [ -n "$tracked" ]; then
            echo "MATLAB Project metadata must stay local and untracked:"
            echo "$tracked"
            exit 1
          fi

  headless:
    name: Headless Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/headless

      - name: Run headless tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: headless
          startup-options: -logfile artifacts/logs/headless/matlab.log

      - name: Summarize headless tests
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/headless/junit.xml
          --run-name headless
          --html artifacts/test-results/headless/html/index.html
          --log artifacts/logs/headless/matlab.log

      - name: Upload headless artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-headless
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/debug/**
            artifacts/logs/**

  coverage:
    name: Coverage Report
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/coverage

      - name: Run coverage report
        uses: matlab-actions/run-build@v3
        with:
          tasks: coverage
          startup-options: -logfile artifacts/logs/coverage/matlab.log

      - name: Summarize coverage test results
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/coverage/junit.xml
          --run-name coverage
          --html artifacts/test-results/coverage/html/index.html
          --log artifacts/logs/coverage/matlab.log

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-coverage
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/coverage/**
            artifacts/debug/**
            artifacts/logs/**

  gui:
    name: GUI Tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/gui

      - name: Run GUI tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: gui
          startup-options: -logfile artifacts/logs/gui/matlab.log

      - name: Summarize GUI tests
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/gui/junit.xml
          --run-name gui
          --html artifacts/test-results/gui/html/index.html
          --log artifacts/logs/gui/matlab.log

      - name: Upload GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-gui
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/debug/**
            artifacts/gui/**
            artifacts/logs/**
