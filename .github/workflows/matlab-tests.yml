name: MATLAB Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

env:
  MATLAB_RELEASE: R2025a

concurrency:
  group: matlab-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check MATLAB Project metadata is local
        run: |
          tracked="$(git ls-files -- LabKit.prj resources/project)"
          if [ -n "$tracked" ]; then
            echo "MATLAB Project metadata must stay local and untracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Check MATLAB batch locator syntax
        run: bash -n scripts/matlab_batch.sh

      - name: Check MATLAB batch locator help
        run: bash scripts/matlab_batch.sh --help

      - name: Check MATLAB batch locator smoke
        run: MATLAB_CMD=true bash scripts/matlab_batch.sh "buildtool listTasks"

  quality:
    name: Quality Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/checkStyle

      - name: Run quality guardrails
        uses: matlab-actions/run-build@v3
        with:
          tasks: checkStyle
          startup-options: -logfile artifacts/logs/checkStyle/matlab.log

      - name: Summarize quality guardrails
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/checkStyle/junit.xml
          --run-name checkStyle
          --html artifacts/test-results/checkStyle/html/index.html
          --log artifacts/logs/checkStyle/matlab.log

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-quality
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/logs/**

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/testUnit

      - name: Run unit tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: testUnit
          startup-options: -logfile artifacts/logs/testUnit/matlab.log

      - name: Summarize unit tests
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/testUnit/junit.xml
          --run-name testUnit
          --html artifacts/test-results/testUnit/html/index.html
          --log artifacts/logs/testUnit/matlab.log

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-unit
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/logs/**

  coverage:
    name: Coverage Report
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/coverage

      - name: Run coverage report
        uses: matlab-actions/run-build@v3
        with:
          tasks: coverage
          startup-options: -logfile artifacts/logs/coverage/matlab.log

      - name: Summarize coverage test results
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/coverage/junit.xml
          --run-name coverage
          --html artifacts/test-results/coverage/html/index.html
          --log artifacts/logs/coverage/matlab.log

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-coverage
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/coverage/**
            artifacts/logs/**

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/testIntegration

      - name: Run integration tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: testIntegration
          startup-options: -logfile artifacts/logs/testIntegration/matlab.log

      - name: Summarize integration tests
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/testIntegration/junit.xml
          --run-name testIntegration
          --html artifacts/test-results/testIntegration/html/index.html
          --log artifacts/logs/testIntegration/matlab.log

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-integration
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/logs/**

  gui-structural:
    name: GUI Structural Tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/testGuiStructural

      - name: Run GUI structural tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: testGuiStructural
          startup-options: -logfile artifacts/logs/testGuiStructural/matlab.log

      - name: Summarize GUI structural tests
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/testGuiStructural/junit.xml
          --run-name testGuiStructural
          --html artifacts/test-results/testGuiStructural/html/index.html
          --log artifacts/logs/testGuiStructural/matlab.log

      - name: Upload GUI structural artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-gui-structural
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/gui/**
            artifacts/logs/**

  gui-gesture:
    name: GUI Gesture Tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/testGuiGesture

      - name: Run GUI gesture tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: testGuiGesture
          startup-options: -logfile artifacts/logs/testGuiGesture/matlab.log

      - name: Summarize GUI gesture tests
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/testGuiGesture/junit.xml
          --run-name testGuiGesture
          --html artifacts/test-results/testGuiGesture/html/index.html
          --log artifacts/logs/testGuiGesture/matlab.log

      - name: Upload GUI gesture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-gui-gesture
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/gui/**
            artifacts/logs/**
