name: MATLAB Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'

env:
  MATLAB_RELEASE: R2025a

concurrency:
  group: matlab-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check MATLAB Project metadata is local
        run: |
          tracked="$(git ls-files -- LabKit.prj resources/project)"
          if [ -n "$tracked" ]; then
            echo "MATLAB Project metadata must stay local and untracked:"
            echo "$tracked"
            exit 1
          fi

  headless-shards:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Unit Tests - LabKit
            run_name: unit-labkit
            selector: '"Suites", "labkit", "Tags", "Unit", "IncludeGui", false'
          - label: Unit Tests - Apps
            run_name: unit-apps
            selector: '"Suites", "apps", "Tags", "Unit", "IncludeGui", false'
          - label: Unit Tests - Project
            run_name: unit-project
            selector: '"Suites", "project", "Tags", "Unit", "IncludeGui", false'
          - label: Integration Tests - Apps
            run_name: integration-apps
            selector: '"Tests", ["AppEntrypointBoundariesTest", "AppLibraryCompatibilityTest", "AppOwnedWorkflowBoundariesTest", "AppPackageStructureGuardrailTest"], "Tags", "Integration", "IncludeGui", false'
          - label: Integration Tests - Project
            run_name: integration-project
            selector: '"Tests", ["BuildTaskFrameworkGuardrailTest", "CiValidationPolicyGuardrailTest", "CodeAnalyzerSuppressionPolicyTest", "PackageDependencyBoundariesTest", "PackagePublicSurfaceTest", "ProjectDebtGuardrailTest", "ProjectDocumentationGuardrailTest", "SensitiveSampleHygieneTest", "StartupBoundariesTest", "TestCompatibilityDebtGuardrailTest"], "Tags", "Integration", "IncludeGui", false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/${{ matrix.run_name }}

      - name: Run ${{ matrix.label }}
        uses: matlab-actions/run-command@v3
        with:
          command: >
            addpath("tests");
            runLabKitTests(${{ matrix.selector }},
            "HtmlReport", false,
            "RunName", "${{ matrix.run_name }}",
            "ArtifactsRoot", fullfile(pwd, "artifacts"));
          startup-options: -logfile artifacts/logs/${{ matrix.run_name }}/matlab.log

      - name: Summarize ${{ matrix.label }}
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/${{ matrix.run_name }}/junit.xml
          --run-name ${{ matrix.run_name }}
          --html artifacts/test-results/${{ matrix.run_name }}/html/index.html
          --log artifacts/logs/${{ matrix.run_name }}/matlab.log

      - name: Upload ${{ matrix.label }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-${{ matrix.run_name }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/${{ matrix.run_name }}/**
            artifacts/debug/${{ matrix.run_name }}/**
            artifacts/logs/${{ matrix.run_name }}/**

  coverage:
    name: Coverage Report
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/coverage

      - name: Run coverage report
        uses: matlab-actions/run-build@v3
        with:
          tasks: coverage
          startup-options: -logfile artifacts/logs/coverage/matlab.log

      - name: Summarize coverage test results
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/coverage/junit.xml
          --run-name coverage
          --html artifacts/test-results/coverage/html/index.html
          --log artifacts/logs/coverage/matlab.log

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-coverage
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/coverage/**
            artifacts/debug/**
            artifacts/logs/**

  gui:
    name: GUI Tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ env.MATLAB_RELEASE }}

      - name: Prepare artifact directories
        run: mkdir -p artifacts/logs/gui

      - name: Run GUI tests
        uses: matlab-actions/run-build@v3
        with:
          tasks: gui
          startup-options: -logfile artifacts/logs/gui/matlab.log

      - name: Summarize GUI tests
        if: always()
        run: >
          python scripts/summarize_junit.py
          artifacts/test-results/gui/junit.xml
          --run-name gui
          --html artifacts/test-results/gui/html/index.html
          --log artifacts/logs/gui/matlab.log

      - name: Upload GUI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-gui
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/debug/**
            artifacts/gui/**
            artifacts/logs/**
