name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope and policy
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
      governance: ${{ steps.scope.outputs.governance }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
          fi
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          python .github/scripts/test_classify_ci_scope.py
          git diff --name-only -z "${BASE_SHA}" "${HEAD_SHA}" |
            python .github/scripts/classify_ci_scope.py \
              --null --github-output "${GITHUB_OUTPUT}"

  platform-matrix:
    name: MATLAB / ${{ matrix.label }} / ${{ matrix.release }}
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            id: linux
            label: Linux
            release: R2022b
          - os: ubuntu-latest
            id: linux
            label: Linux
            release: latest
          - os: windows-2022
            id: windows
            label: Windows
            release: R2022b
          - os: windows-latest
            id: windows
            label: Windows
            release: latest
          - os: macos-14
            id: macos
            label: macOS
            release: latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up clean MATLAB runtime
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}

      - name: Prepare MATLAB artifact directories
        shell: bash
        run: mkdir -p artifacts/logs/headless artifacts/logs/gui artifacts/logs/isolated

      - name: Run full non-GUI validation
        id: headless
        continue-on-error: true
        timeout-minutes: 30
        uses: matlab-actions/run-build@v3
        with:
          tasks: headless
          startup-options: -logfile artifacts/logs/headless/matlab.log

      - name: Summarize headless validation
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/test-results/headless/junit.xml ]; then
            python .github/scripts/summarize_junit.py \
              artifacts/test-results/headless/junit.xml \
              --run-name "headless-${{ matrix.id }}-${{ matrix.release }}" \
              --log artifacts/logs/headless/matlab.log \
              --active-test artifacts/test-results/headless/active-test.json
          else
            echo "::warning::Headless validation did not produce JUnit output."
          fi

      - name: Run hidden GUI validation
        id: gui
        continue-on-error: true
        timeout-minutes: 30
        uses: matlab-actions/run-build@v3
        with:
          tasks: gui
          startup-options: -logfile artifacts/logs/gui/matlab.log

      - name: Summarize GUI validation
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/test-results/gui/junit.xml ]; then
            python .github/scripts/summarize_junit.py \
              artifacts/test-results/gui/junit.xml \
              --run-name "gui-${{ matrix.id }}-${{ matrix.release }}" \
              --log artifacts/logs/gui/matlab.log \
              --active-test artifacts/test-results/gui/active-test.json
          else
            echo "::warning::GUI validation did not produce JUnit output."
          fi

      - name: Run path-isolation validation
        id: isolated
        continue-on-error: true
        timeout-minutes: 30
        uses: matlab-actions/run-build@v3
        with:
          tasks: isolated
          startup-options: -logfile artifacts/logs/isolated/matlab.log

      - name: Summarize path-isolation validation
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/test-results/isolated/junit.xml ]; then
            python .github/scripts/summarize_junit.py \
              artifacts/test-results/isolated/junit.xml \
              --run-name "isolated-${{ matrix.id }}-${{ matrix.release }}" \
              --log artifacts/logs/isolated/matlab.log \
              --active-test artifacts/test-results/isolated/active-test.json
          else
            echo "::warning::Path-isolation validation did not produce JUnit output."
          fi

      - name: Upload platform artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matlab-${{ matrix.id }}-${{ matrix.release }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**
            artifacts/debug/**
            artifacts/gui/**
            artifacts/logs/**

      - name: Require every validation profile
        if: always()
        shell: bash
        run: |
          test '${{ steps.headless.outcome }}' = 'success'
          test '${{ steps.gui.outcome }}' = 'success'
          test '${{ steps.isolated.outcome }}' = 'success'

  docs-check:
    name: Documentation check
    needs: change-scope
    if: >-
      needs.change-scope.outputs.full == 'true' ||
      needs.change-scope.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up clean MATLAB runtime
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Verify generated documentation
        uses: matlab-actions/run-build@v3
        with:
          tasks: docsCheck

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - change-scope
      - platform-matrix
      - docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation profiles
        shell: bash
        run: |
          test '${{ needs.change-scope.result }}' = 'success'
          if [ '${{ needs.change-scope.outputs.full }}' = 'true' ]; then
            test '${{ needs.platform-matrix.result }}' = 'success'
          fi
          if [ '${{ needs.change-scope.outputs.full }}' = 'true' ] ||
             [ '${{ needs.change-scope.outputs.docs }}' = 'true' ]; then
            test '${{ needs.docs-check.result }}' = 'success'
          fi
