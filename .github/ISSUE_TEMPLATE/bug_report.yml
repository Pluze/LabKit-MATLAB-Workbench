name: Bug report
description: Report a launcher, app, parser, export, or validation problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a LabKit problem. Do not upload raw lab files, identifying file names, subject names, device serials, local absolute paths, timestamps, or private experiment labels. Use synthetic or redacted examples when possible.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Pick the closest area affected by the problem.
      options:
        - Launcher
        - Electrochemistry app
        - DIC app
        - Image measurement app
        - Wearable biosignal app
        - Neurophysiology app
        - DTA/RHS/biosignal loading
        - Testing, CI, or release
        - Documentation
        - Unsure
    validations:
      required: true
  - type: input
    id: app-command
    attributes:
      label: App command or file
      description: If this is app-specific, name the app command or relevant file.
      placeholder: labkit_CIC_app
  - type: dropdown
    id: labkit-source
    attributes:
      label: LabKit source
      description: How did you get this copy of LabKit?
      options:
        - Release button in launcher
        - Latest button in launcher
        - Downloaded release asset
        - Git checkout on main
        - Development branch
        - Unsure
    validations:
      required: true
  - type: input
    id: matlab-version
    attributes:
      label: MATLAB version
      placeholder: R2025a
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the shortest sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should LabKit have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the visible error text if there is one.
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Logs or artifacts
      description: Paste short, redacted excerpts or name generated artifact folders such as artifacts/logs/<RunName>/.
  - type: checkboxes
    id: data-hygiene
    attributes:
      label: Data hygiene
      options:
        - label: I removed or avoided raw lab data, identifying names, serials, local paths, timestamps, and private experiment labels.
          required: true
